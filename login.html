<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | Dunia Axolotl</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <!-- CSS eksternal (satu file untuk semua halaman) -->
  <link rel="stylesheet" href="style.css">

  <!-- JavaScript eksternal: dimuat di head agar tema terpasang lebih dulu (anti-kedip) -->
  <script src="script.js"></script>
</head>

<body>

  <!-- Tombol gelap/terang -->
  <button class="theme-toggle floating" id="themeToggle" type="button" aria-label="Ganti ke mode gelap" aria-pressed="false">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <main class="login-page">

    <!-- ===== PANEL SAMBUTAN ===== -->
    <aside class="login-side">
      <span class="bubble" aria-hidden="true" style="--s:18px;--l:10%;--t:9s;--dl:0s"></span>
      <span class="bubble" aria-hidden="true" style="--s:28px;--l:35%;--t:12s;--dl:2s"></span>
      <span class="bubble" aria-hidden="true" style="--s:14px;--l:62%;--t:8s;--dl:4s"></span>
      <span class="bubble" aria-hidden="true" style="--s:24px;--l:85%;--t:11s;--dl:1s"></span>

      <a class="logo" href="index.html">Dunia Axolotl</a>
      <div class="art">
        <svg viewBox="0 0 320 260" aria-hidden="true">
        <g class="gill left g1"><line x1="105" y1="115" x2="38" y2="75"  stroke="#e0709a" stroke-width="9" stroke-linecap="round"/><circle cx="36" cy="73" r="8" fill="#e0709a"/></g>
        <g class="gill left g2"><line x1="102" y1="130" x2="30" y2="128" stroke="#e0709a" stroke-width="9" stroke-linecap="round"/><circle cx="28" cy="128" r="8" fill="#e0709a"/></g>
        <g class="gill left g3"><line x1="106" y1="145" x2="40" y2="182" stroke="#e0709a" stroke-width="9" stroke-linecap="round"/><circle cx="38" cy="184" r="8" fill="#e0709a"/></g>
        <g class="gill right g1"><line x1="215" y1="115" x2="282" y2="75"  stroke="#e0709a" stroke-width="9" stroke-linecap="round"/><circle cx="284" cy="73" r="8" fill="#e0709a"/></g>
        <g class="gill right g2"><line x1="218" y1="130" x2="290" y2="128" stroke="#e0709a" stroke-width="9" stroke-linecap="round"/><circle cx="292" cy="128" r="8" fill="#e0709a"/></g>
        <g class="gill right g3"><line x1="214" y1="145" x2="280" y2="182" stroke="#e0709a" stroke-width="9" stroke-linecap="round"/><circle cx="282" cy="184" r="8" fill="#e0709a"/></g>
        <ellipse cx="160" cy="140" rx="100" ry="76" fill="#fbd5e0"/>
        <ellipse cx="108" cy="162" rx="14" ry="9" fill="#e0709a" opacity=".45"/>
        <ellipse cx="212" cy="162" rx="14" ry="9" fill="#e0709a" opacity=".45"/>
        <g class="eye l"><circle cx="122" cy="130" r="8" fill="#1f3a45"/><circle cx="125" cy="127" r="2.5" fill="#fff"/></g>
        <g class="eye r"><circle cx="198" cy="130" r="8" fill="#1f3a45"/><circle cx="201" cy="127" r="2.5" fill="#fff"/></g>
        <path d="M130 160 Q160 188 190 160" fill="none" stroke="#1f3a45" stroke-width="5" stroke-linecap="round"/>
          </svg>
      </div>
      <h2>Halo, sahabat axolotl!</h2>
      <p class="tagline">Masuk untuk melanjutkan petualanganmu mengenal si naga air yang menggemaskan.</p>
    </aside>

    <!-- ===== FORMULIR ===== -->
    <div class="login-main">
      <div class="login-card" id="loginCard">
        <h1>Masuk</h1>
        <p class="sub">Selamat datang kembali. Silakan isi data akunmu.</p>

        <!-- novalidate: pesan kesalahan diatur sendiri oleh login.js agar berbahasa Indonesia -->
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required aria-describedby="email-error">
            <p class="error" id="email-error"></p>
          </div>

          <div class="field">
            <label for="password">Kata sandi</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" autocomplete="current-password" required aria-describedby="password-error">
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Tampilkan kata sandi" aria-pressed="false">
                <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="error" id="password-error"></p>
          </div>

          <div class="row">
            <label class="check"><input type="checkbox" id="ingat" name="ingat"> Ingat saya</label>
            <!-- Ganti "#" dengan halaman pemulihan sandi -->
            <a class="link" href="#">Lupa kata sandi?</a>
          </div>

          <button type="submit" class="btn submit" id="submitBtn">Masuk</button>
          <p class="form-status" id="status" role="status" aria-live="polite"></p>
        </form>

        <!-- Ganti "#" dengan halaman pendaftaran -->
        <p class="signup">Belum punya akun? <a class="link" href="#">Daftar sekarang</a></p>
      </div>
    </div>
  </main>

</body>
</html>
